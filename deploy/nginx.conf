# Dixiyang 前端静态站 + /api 反向代理（含 SSE 流式放行）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 图片/封面/聊天附件上传
    client_max_body_size 50m;

    # 容器健康检查
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 管理控制台独立入口：/admin 自动跳到 /admin.html（hash 路由）
    location = /admin {
        return 302 /admin.html;
    }

    # API / SSE 统一转发到后端容器；proxy_pass 末尾不能加 /，否则会剥掉 /api 前缀
    location /api/ {
        proxy_pass http://backend:8084;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 真流式：关闭缓冲，长连接不超时
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Vite 带 hash 的静态资源可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 深链兜底（/home、/ideas 等刷新不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}
