[project]
name = "dixiyang-fast"
version = "1.0.0"
description = "Dixiyang RAG 课程作业 - Python 后端 (RAG 知识库构建与检索)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web / 数据库
    "fastapi[standard]>=0.136,<1",
    "uvicorn[standard]>=0.49,<1",
    "sqlalchemy>=2.0.40,<3",
    "pymysql>=1.1,<2",
    "python-dotenv>=1.0,<2",
    # 认证
    "python-jose[cryptography]>=3.4,<4",
    "passlib[bcrypt]>=1.7.4,<2",
    "bcrypt>=4,<6",
    "python-multipart>=0.0.20,<1",
    "pydantic>=2,<3",
    # AI / RAG（主后端启动时 rag router 会 import langchain_chroma）
    "langchain-openai>=1.3,<2",
    "langchain-chroma>=1.1,<2",
    "chromadb>=1.5,<2",
    # Redis（广场推荐缓存，缺失时自动降级）
    "redis>=5,<9",
    "jinja2>=3,<4",
]

# 共享库已通过 uv pip install -e ../rag-shared 安装
# torch 由 rag-shared 的 optional-dependencies 提供

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.4.0",
    "mypy>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
